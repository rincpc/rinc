# The apps as web pages, on GitHub Pages (rincpc.com): each push to main builds the web player and a
# headless rinc, makes a page of each app (rinc -web), a page of the whole Rinc (home, the console, the
# editor and every app), and an index linking them, from each app's first comment line, and the docs
# (mdbook, from docs/) under /docs.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2
      - name: Build the web player and a headless rinc
        run: |
          python3 tools/web.py --wasm=rinc.wasm --wasm-full=rinc-full.wasm
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DRINC_PLATFORM=desktop -DRINC_SDL=OFF -DRINC_WEB_WASM=rinc.wasm -DRINC_WEB_WASM_FULL=rinc-full.wasm
          cmake --build build --parallel
      - name: Make the pages
        run: |
          mkdir -p site
          {
            echo '<!doctype html><html lang="en"><head><meta charset="utf-8">'
            echo '<meta name="viewport" content="width=device-width, initial-scale=1"><title>Rinc apps</title>'
            echo '<style>body{margin:0;padding:24px 16px;background:#1d2b53;color:#fff1e8;font:16px/1.5 ui-monospace,monospace}'
            echo 'main{max-width:720px;margin:auto}a{color:#ffec27}h1{font-size:22px}li{margin:10px 0}p{color:#c2c3c7}</style>'
            echo '</head><body><main><h1>Rinc apps</h1>'
            echo '<p>Rinc apps, playing in the browser: the same Rio VM as on the board and the desktop. Arrows and V C X Z, or a controller. <a href="docs/">Docs</a>: making apps, and what a Rinc provides.</p>'
            echo '<p><a href="rinc.html">The whole Rinc</a>: home, the console, the editor, files, help (with these docs), colors, themes and every app below, as on the Fruit Jam. What you save stays in this browser. Ctrl and Shift tapped together, and then Esc, goes home.</p>'
            echo '<p><a href="empty.html">An empty Rinc</a>: nothing installed yet. Drop a bundle of apps on it, such as <code>rinc-system-apps.zip</code> from a <a href="https://github.com/rincpc/rinc/releases">release</a>. Its Reset button takes it back to empty.</p><ul>'
            demos=""
            for app in apps/*.rio apps/*/; do # (an app of one file, or of a folder)
              name=$(basename "$app" .rio)
              [ -d "$app" ] && app="${app%/}/$name.rio"
              case $name in bench|micro) continue;; esac # (timings, not demos)
              build/rinc "$app" -web "site/$name.html"
              demos="$demos $app"
              about=$(head -1 "$app" | sed -e 's/^# *//' -e 's/&/\&amp;/g' -e 's/</\&lt;/g')
              echo "<li><a href=\"$name.html\">$name</a>: $about</li>"
            done
            echo '</ul><p><a href="docs/">Docs</a> &middot; <a href="https://github.com/rincpc/rinc">Source</a></p></main></body></html>'
          } > site/index.html
          build/rinc -name rinc-empty -web site/empty.html
          system=""
          for d in system/*/; do # (every system app; system/rinc holds the themes, carried as files)
            name=$(basename "$d")
            [ -f "$d$name.rio" ] && system="$system $d$name.rio"
          done
          build/rinc $system $demos -home home -name rinc \
            -docs rinc=docs -docs rio=lib/rio/docs -files apps/rinc=system/rinc -web site/rinc.html
          ls -l site
      - name: Make the docs
        run: |
          # the built-in apps' own help (system/<app>/help) as "Using Rinc", after Rinc's intro
          for d in system/*/help; do app=$(basename "$(dirname "$d")"); mkdir -p "docs/using/$app"; cp -r "$d"/. "docs/using/$app/"; done
          { sed -n '1,/^\[Rinc\]/p' docs/SUMMARY.md; echo; echo '# Using Rinc'; echo
            for app in home help edit console; do [ -f "docs/using/$app/README.md" ] &&
              echo "- [$(head -1 "docs/using/$app/README.md" | sed 's/^# *//')](using/$app/README.md)"; done
            sed -n '/^\[Rinc\]/,$p' docs/SUMMARY.md | tail -n +2; } > docs/SUMMARY.new && mv docs/SUMMARY.new docs/SUMMARY.md
          v=0.4.40
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v$v/mdbook-v$v-x86_64-unknown-linux-gnu.tar.gz" | tar -xz
          ./mdbook build docs --dest-dir ../site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
